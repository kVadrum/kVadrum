<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="kVadrum — the lab, online">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#1b2230"/>
    </pattern>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2dd4bf" stop-opacity="0.10"/>
      <stop offset="1"   stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="300"/></clipPath>
    <style>.mono{font-family:ui-monospace,'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}</style>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="300" fill="#0d1117"/>
  <rect width="1200" height="300" fill="url(#dots)"/>

  <!-- ambient scanline sweep (pure decoration; invisible if SMIL is off) -->
  <g clip-path="url(#frame)">
    <rect x="0" y="-70" width="1200" height="70" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 370" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ══ quadrum mark: top-left always lit; the other three boot-pulse then rest dim ══ -->
  <g transform="translate(112 90)">
    <rect x="0"  y="0"  width="56" height="56" rx="9" fill="#10171f" stroke="#232c38" stroke-width="2.5"/>
    <rect x="64" y="0"  width="56" height="56" rx="9" fill="#10171f" stroke="#232c38" stroke-width="2.5"/>
    <rect x="0"  y="64" width="56" height="56" rx="9" fill="#10171f" stroke="#232c38" stroke-width="2.5"/>
    <rect x="64" y="64" width="56" height="56" rx="9" fill="#10171f" stroke="#232c38" stroke-width="2.5"/>

    <!-- breathing halo behind the lit cell -->
    <rect x="-14" y="-14" width="84" height="84" rx="18" fill="url(#halo)" opacity="0">
      <animate attributeName="opacity" values="0.35;0.85;0.35" dur="4.6s" repeatCount="indefinite"/>
    </rect>

    <!-- top-left: the signature lit cell, steady -->
    <rect x="0" y="0" width="56" height="56" rx="9" fill="url(#teal)"/>
    <!-- the other three: rest dim, flash once on boot -->
    <rect x="64" y="0"  width="56" height="56" rx="9" fill="url(#teal)" opacity="0.14">
      <animate attributeName="opacity" values="0.14;1;1;0.14" keyTimes="0;0.3;0.55;1" dur="1.5s" begin="0.35s" fill="freeze"/>
    </rect>
    <rect x="0"  y="64" width="56" height="56" rx="9" fill="url(#teal)" opacity="0.14">
      <animate attributeName="opacity" values="0.14;1;1;0.14" keyTimes="0;0.3;0.55;1" dur="1.5s" begin="0.55s" fill="freeze"/>
    </rect>
    <rect x="64" y="64" width="56" height="56" rx="9" fill="url(#teal)" opacity="0.22">
      <animate attributeName="opacity" values="0.22;1;1;0.22" keyTimes="0;0.3;0.55;1" dur="1.5s" begin="0.75s" fill="freeze"/>
    </rect>
  </g>

  <!-- ══ wordmark (always visible) ══ -->
  <text class="mono" x="300" y="150" font-size="90" font-weight="700" letter-spacing="-3" fill="#e6edf3">k<tspan fill="#2dd4bf">V</tspan>adrum</text>
  <rect x="304" y="168" width="150" height="5" rx="2.5" fill="#2dd4bf"/>

  <!-- ══ prompt line with blinking cursor ══ -->
  <text class="mono" x="306" y="205" font-size="19" font-weight="500" letter-spacing="0.5" fill="#2dd4bf">&gt; the lab · online</text>
  <rect x="514" y="191" width="11" height="17" fill="#2dd4bf">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- ══ cycling tagline (phrase 1 shows even if SMIL is off) ══ -->
  <g class="mono" font-size="22" font-weight="500" letter-spacing="0.5" fill="#8b949e">
    <text x="306" y="243" opacity="1">build mode<animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1;1" keyTimes="0;0.2;0.24;0.25;0.9;0.94;0.95;0.99;1;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="306" y="243" opacity="0">agentic workshop<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="306" y="243" opacity="0">human-in-the-loop<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="306" y="243" opacity="0">build for what comes next<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="10s" repeatCount="indefinite"/></text>
  </g>
</svg>
