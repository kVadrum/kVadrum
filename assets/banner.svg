<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="kVadrum — the lab, online · proof of build">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#1b2230"/>
    </pattern>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="iri" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2dd4bf" stop-opacity="0.09"/>
      <stop offset="1"   stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="300"/></clipPath>
    <clipPath id="tickerclip"><rect x="0" y="266" width="1200" height="34"/></clipPath>
    <style>.mono{font-family:ui-monospace,'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}</style>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="300" fill="#0d1117"/>
  <rect width="1200" height="300" fill="url(#dots)"/>

  <!-- ambient scanline sweep -->
  <g clip-path="url(#frame)">
    <rect x="0" y="-70" width="1200" height="70" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 370" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ══ quadrum mark: lit genesis cell + boot-pulse on the other three ══ -->
  <g transform="translate(96 84)">
    <rect x="0"  y="0"  width="56" height="56" rx="9" fill="#10171f" stroke="#232c38" stroke-width="2.5"/>
    <rect x="64" y="0"  width="56" height="56" rx="9" fill="#10171f" stroke="#232c38" stroke-width="2.5"/>
    <rect x="0"  y="64" width="56" height="56" rx="9" fill="#10171f" stroke="#232c38" stroke-width="2.5"/>
    <rect x="64" y="64" width="56" height="56" rx="9" fill="#10171f" stroke="#232c38" stroke-width="2.5"/>

    <rect x="-14" y="-14" width="84" height="84" rx="18" fill="url(#halo)" opacity="0">
      <animate attributeName="opacity" values="0.35;0.85;0.35" dur="4.6s" repeatCount="indefinite"/>
    </rect>

    <!-- genesis cell: steady, iridescent -->
    <rect x="0" y="0" width="56" height="56" rx="9" fill="url(#iri)"/>
    <!-- the next three blocks: rest dim, flash once on boot -->
    <rect x="64" y="0"  width="56" height="56" rx="9" fill="url(#teal)" opacity="0.14">
      <animate attributeName="opacity" values="0.14;1;1;0.14" keyTimes="0;0.3;0.55;1" dur="1.5s" begin="0.35s" fill="freeze"/>
    </rect>
    <rect x="0"  y="64" width="56" height="56" rx="9" fill="url(#teal)" opacity="0.14">
      <animate attributeName="opacity" values="0.14;1;1;0.14" keyTimes="0;0.3;0.55;1" dur="1.5s" begin="0.55s" fill="freeze"/>
    </rect>
    <rect x="64" y="64" width="56" height="56" rx="9" fill="url(#teal)" opacity="0.22">
      <animate attributeName="opacity" values="0.22;1;1;0.22" keyTimes="0;0.3;0.55;1" dur="1.5s" begin="0.75s" fill="freeze"/>
    </rect>
  </g>

  <!-- ══ wordmark ══ -->
  <text class="mono" x="272" y="146" font-size="84" font-weight="700" letter-spacing="-3" fill="#e6edf3">k<tspan fill="url(#iri)">V</tspan>adrum</text>
  <rect x="276" y="164" width="140" height="5" rx="2.5" fill="url(#iri)"/>

  <!-- ══ prompt line ══ -->
  <text class="mono" x="278" y="200" font-size="19" font-weight="500" letter-spacing="0.5" fill="#2dd4bf">&gt; the lab · online</text>
  <rect x="489" y="186" width="11" height="17" fill="#2dd4bf">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- ══ cycling tagline (first phrase shows even if animation is off) ══ -->
  <g class="mono" font-size="22" font-weight="500" letter-spacing="0.5" fill="#8b949e">
    <text x="278" y="240" opacity="1">proof of build<animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1;1" keyTimes="0;0.2;0.24;0.25;0.9;0.94;0.95;0.99;1;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="278" y="240" opacity="0">human-in-the-loop<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="278" y="240" opacity="0">self-custody by default<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="278" y="240" opacity="0">don't trust, verify<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="10s" repeatCount="indefinite"/></text>
  </g>

  <!-- ══ recent-blocks explorer card (real chain: this repo's git history) ══ -->
  <g transform="translate(760 40)">
    <rect width="400" height="212" rx="14" fill="#0b0f14"/>
    <rect x="0.75" y="0.75" width="398.5" height="210.5" rx="13.25" fill="none" stroke="#1b2230" stroke-width="1.5"/>
    <text class="mono" x="22" y="30" font-size="15" letter-spacing="1" fill="#8b949e">recent blocks</text>
    <circle cx="372" cy="24" r="4.5" fill="#2dd4bf">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <line x1="0" y1="44" x2="400" y2="44" stroke="#161d27" stroke-width="1.5"/>

    <!-- blk 021 (latest) -->
    <g class="mono">
      <rect x="22" y="60" width="54" height="26" rx="7" fill="#131a24" stroke="#243040" stroke-width="1.25"/>
      <text x="34" y="78" font-size="14" fill="#2dd4bf">021</text>
      <text x="92" y="79" font-size="18" fill="#e6edf3">9b415c9</text>
      <text x="212" y="78" font-size="13" fill="#8b949e">profile boots</text>
      <circle cx="374" cy="71" r="3.5" fill="url(#iri)">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- blk 020 -->
    <g class="mono" opacity="0.75">
      <rect x="22" y="104" width="54" height="26" rx="7" fill="#131a24" stroke="#243040" stroke-width="1.25"/>
      <text x="34" y="122" font-size="14" fill="#2dd4bf">020</text>
      <text x="92" y="123" font-size="18" fill="#e6edf3">adf8bdf</text>
      <text x="212" y="122" font-size="13" fill="#8b949e">trim + tidy</text>
    </g>
    <!-- blk 019 -->
    <g class="mono" opacity="0.5">
      <rect x="22" y="148" width="54" height="26" rx="7" fill="#131a24" stroke="#243040" stroke-width="1.25"/>
      <text x="34" y="166" font-size="14" fill="#2dd4bf">019</text>
      <text x="92" y="167" font-size="18" fill="#e6edf3">f6cbfe3</text>
      <text x="212" y="166" font-size="13" fill="#8b949e">hero fold</text>
    </g>

    <text class="mono" x="22" y="196" font-size="13" fill="#4b5563">next block · building</text>
    <rect x="182" y="185" width="8" height="12" fill="#4b5563">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ══ hash ticker: the chain itself, drifting ══ -->
  <g clip-path="url(#tickerclip)" class="mono" font-size="13" fill="#2a3646">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1638 0" dur="48s" repeatCount="indefinite"/>
      <text x="0" y="289" letter-spacing="0">9b415c9 · adf8bdf · f6cbfe3 · 84a9fc9 · b29ab33 · b07ac87 · 4921c98 · e59b9a6 · 2379b48 · acc3903 · 50deaca · cfa1de6 · 9529968 · 7513d31 · f2759c0 · 55039f8 · 1e343c9 · 808479c · 82932eb · d08506f · 1e2d6ab · </text>
      <text x="1638" y="289" letter-spacing="0">9b415c9 · adf8bdf · f6cbfe3 · 84a9fc9 · b29ab33 · b07ac87 · 4921c98 · e59b9a6 · 2379b48 · acc3903 · 50deaca · cfa1de6 · 9529968 · 7513d31 · f2759c0 · 55039f8 · 1e343c9 · 808479c · 82932eb · d08506f · 1e2d6ab · </text>
    </g>
  </g>
</svg>
