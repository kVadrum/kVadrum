<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="kVadrum — build mode">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#1b2230"/>
    </pattern>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="300" fill="#0d1117"/>
  <rect width="1200" height="300" fill="url(#dots)"/>

  <!-- mark: the four squares, one lit -->
  <g transform="translate(110 90)">
    <rect x="0"  y="0"  width="56" height="56" rx="9" fill="url(#teal)"/>
    <rect x="64" y="0"  width="56" height="56" rx="9" fill="none" stroke="#30363d" stroke-width="3"/>
    <rect x="0"  y="64" width="56" height="56" rx="9" fill="none" stroke="#30363d" stroke-width="3"/>
    <rect x="64" y="64" width="56" height="56" rx="9" fill="#10242a" stroke="#1f3a3a" stroke-width="3"/>
  </g>

  <!-- wordmark -->
  <text x="290" y="160" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="104" font-weight="800" letter-spacing="-2" fill="#e6edf3">k<tspan fill="#2dd4bf">V</tspan>adrum</text>

  <!-- accent underline -->
  <rect x="294" y="182" width="162" height="5" rx="2.5" fill="#2dd4bf"/>

  <!-- tagline -->
  <text x="296" y="226" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="600" letter-spacing="3.5" fill="#8b949e">BUILD MODE · SYSTEMS · PROTOTYPING · BLEEDING EDGE</text>
</svg>
